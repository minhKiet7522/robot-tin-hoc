# Tự đưa Edge Functions lên Supabase mỗi khi push thay đổi trong supabase/functions/
name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
  workflow_dispatch:   # cho phép bấm chạy tay trong tab Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: nsrtpgxcnloqmuntaehu
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0   # cố định phiên bản để cờ lệnh không đổi bất ngờ
      - name: Deploy functions
        run: supabase functions deploy --remote="$PROJECT_REF" --use-api --yes
